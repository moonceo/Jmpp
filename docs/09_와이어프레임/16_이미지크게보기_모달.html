<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이미지 크게 보기 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:600px; margin:7vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0; font-size:20px; } p { margin:8px 0 16px; color:#64748b; }
    .image { height:390px; border:1px solid #e2e8f0; border-radius:10px; background:linear-gradient(135deg,#f8fafc,#e2e8f0); display:flex; align-items:center; justify-content:center; color:#64748b; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    button { height:38px; border-radius:8px; border:1px solid #cbd5e1; background:white; padding:0 14px; font-weight:700; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>이미지 크게 보기</h1>
    <p>실리콘 조리도구 6종 세트</p>
    <div class="image">상품 이미지 확대 영역</div>
    <div class="actions"><button>이미지 복사</button><button>닫기</button></div>
  </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마켓/스토어 필터 팝오버 확인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 76px;
      padding: 14px 18px;
      border-bottom: 1px solid #e2e8f0;
      background: white;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: -0.02em; }
    p { margin: 5px 0 0; color: #64748b; font-size: 13px; }
    a, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 12px;
      color: #0f172a;
      text-decoration: none;
      background: white;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    a.primary { background: #111827; color: white; border-color: #111827; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    iframe {
      width: 100%;
      height: calc(100vh - 76px);
      border: 0;
      background: white;
    }
    main { padding: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: white;
      text-decoration: none;
    }
    .card strong { display: block; font-size: 15px; }
    .card span { color: #64748b; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>마켓/스토어 필터 팝오버 확인</h1>
      <p>현재 주문관리 화면에서 마켓/스토어 필터를 열어 실제 팝오버를 확인합니다.</p>
    </div>
    <div class="actions">
      <a href="00_전체화면_인덱스.html">전체 화면</a>
      <a class="primary" href="http://localhost:3000/orders?view=new" target="_blank" rel="noreferrer">현재 앱에서 열기</a>
    </div>
  </header>
  <iframe src="http://localhost:3000/orders?view=new"></iframe>
</body>
</html>

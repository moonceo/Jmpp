<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배송정보 수정 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:520px; margin:7vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0; font-size:20px; } p { margin:8px 0 16px; color:#64748b; font-size:13px; }
    label { display:block; margin:12px 0 6px; font-size:13px; color:#475569; }
    input { width:100%; height:38px; border:1px solid #cbd5e1; border-radius:8px; padding:0 10px; box-sizing:border-box; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .badge { display:inline-block; margin-top:8px; padding:4px 8px; border-radius:999px; background:#ecfdf5; color:#047857; font-size:12px; font-weight:700; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    button { height:38px; border-radius:8px; border:1px solid #cbd5e1; background:white; padding:0 14px; font-weight:700; }
    .primary { background:#111827; color:white; border-color:#111827; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>배송정보 수정</h1>
    <p>수령인 배송정보와 개인통관부호를 함께 수정합니다.</p>
    <div class="row"><div><label>수령인</label><input value="오유나" /></div><div><label>연락처</label><input value="010-3131-2222" /></div></div>
    <label>주소</label><input value="31168 충청남도 천안시 서북구 불당25로 182" />
    <label>개인통관부호</label><input value="P313122221234" /><span class="badge">통관부호 일치</span>
    <div class="actions"><button>취소</button><button class="primary">저장</button></div>
  </div>
</body>
</html>

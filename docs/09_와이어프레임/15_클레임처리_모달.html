<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>클레임 처리 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:640px; margin:10vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0 0 8px; font-size:20px; } p { color:#64748b; }
    dl { display:grid; grid-template-columns:120px 1fr; gap:9px 12px; margin:18px 0; }
    dt { color:#64748b; } dd { margin:0; font-weight:700; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    button { height:38px; border-radius:8px; border:1px solid #cbd5e1; background:white; padding:0 14px; font-weight:700; }
    .primary { background:#111827; color:white; border-color:#111827; }
    .danger { color:#dc2626; border-color:#fecaca; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>취소처리</h1>
    <p>마켓에서 수집된 취소 클레임의 사유와 주문 정보를 확인합니다.</p>
    <dl>
      <dt>클레임 유형</dt><dd>취소</dd>
      <dt>현재 단계</dt><dd>발송대기</dd>
      <dt>클레임 사유</dt><dd>구매자 단순 변심</dd>
      <dt>상품</dt><dd>다용도 접이식 빨래바구니</dd>
      <dt>마켓 주문번호</dt><dd>GMARKET-CLAIM-0019</dd>
      <dt>소싱라이프</dt><dd>-</dd>
    </dl>
    <div class="actions"><button>닫기</button><button class="danger">취소거부</button><button class="primary">취소승인</button></div>
  </div>
</body>
</html>

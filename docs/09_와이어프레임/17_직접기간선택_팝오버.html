<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>직접 기간 선택 팝오버</title>
  <style>
    body { margin:0; min-height:100vh; font-family:Arial,"Noto Sans KR",sans-serif; background:#f8fafc; color:#0f172a; }
    .bar { display:flex; gap:0; width:max-content; margin:96px auto 0; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; background:white; box-shadow:0 4px 14px rgba(15,23,42,.08); }
    .bar button { height:34px; border:0; border-right:1px solid #e2e8f0; background:white; padding:0 14px; font-size:13px; font-weight:700; color:#475569; }
    .bar button:last-child { border-right:0; background:#f1f5f9; color:#0f172a; }
    .popover { width:240px; margin:8px auto 0; background:white; border:1px solid #d9e0ea; border-radius:8px; box-shadow:0 14px 35px rgba(15,23,42,.16); padding:12px; }
    label { display:grid; gap:6px; margin-bottom:10px; font-size:12px; font-weight:700; color:#64748b; }
    input { width:100%; height:34px; border:1px solid #cbd5e1; border-radius:6px; padding:0 8px; box-sizing:border-box; background:white; }
  </style>
</head>
<body>
  <div class="bar">
    <button>오늘</button>
    <button>3일</button>
    <button>7일</button>
    <button>30일</button>
    <button>직접 입력</button>
  </div>
  <div class="popover">
    <label>시작날짜<input type="date" value="2026-06-01" /></label>
    <label>끝나는날짜<input type="date" value="2026-06-18" /></label>
  </div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주문취소 확인 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:420px; margin:18vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0 0 10px; font-size:20px; } p { color:#64748b; line-height:1.5; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    button { height:38px; border-radius:8px; border:1px solid #cbd5e1; background:white; padding:0 14px; font-weight:700; }
    .danger { color:#dc2626; border-color:#fecaca; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>주문취소 확인</h1>
    <p>공식 취소 사유와 상세 사유를 확인해 판매자 취소 명령을 접수합니다. 접수 후에는 처리보류·마켓 취소요청으로 표시하며, 마켓의 최종 취소 확인 전에는 취소 완료로 표시하지 않습니다.</p>
    <p>일부 주문 접수에 실패하면 이 창을 유지하고 주문번호별 실패 사유를 표시합니다. UNKNOWN 명령은 자동 재호출하지 않습니다.</p>
    <div class="actions"><button>닫기</button><button class="danger">판매자 취소 명령 접수</button></div>
  </div>
</body>
</html>

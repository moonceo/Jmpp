<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>직접 기간 선택 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:380px; margin:18vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0 0 16px; font-size:20px; } label { display:block; margin:12px 0 6px; font-size:13px; color:#475569; }
    input { width:100%; height:38px; border:1px solid #cbd5e1; border-radius:8px; padding:0 10px; box-sizing:border-box; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    button { height:38px; border-radius:8px; border:1px solid #cbd5e1; background:white; padding:0 14px; font-weight:700; }
    .primary { background:#111827; color:white; border-color:#111827; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>직접 기간 선택</h1>
    <label>시작날짜</label><input type="date" value="2026-06-01" />
    <label>끝나는날짜</label><input type="date" value="2026-06-18" />
    <div class="actions"><button>취소</button><button class="primary">적용</button></div>
  </div>
</body>
</html>

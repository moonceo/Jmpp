<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마켓 추가/수정 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:620px; margin:4vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0 0 18px; font-size:20px; } h2 { font-size:15px; margin:20px 0 10px; }
    label { display:block; margin:12px 0 6px; font-size:13px; color:#475569; }
    input, select { width:100%; height:38px; border:1px solid #cbd5e1; border-radius:8px; padding:0 10px; box-sizing:border-box; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .guide { border:1px solid #a7f3d0; background:#ecfdf5; border-radius:10px; padding:14px; color:#047857; font-size:13px; }
    .actions { display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
    button { height:38px; border-radius:8px; border:1px solid #cbd5e1; background:white; padding:0 14px; font-weight:700; }
    .primary { background:#111827; color:white; border-color:#111827; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>마켓 추가 / 계정 수정</h1>
    <label>마켓</label><select><option>스마트스토어</option><option>쿠팡</option><option>11번가</option><option>G마켓</option><option>옥션</option></select>
    <div class="guide">선택한 마켓의 API 인증 정보를 입력하고 테스트 후 추가합니다.</div>
    <div class="row"><div><label>스토어명</label><input placeholder="예: 리빙온마켓" /></div><div><label>사업자번호</label><input placeholder="000-00-00000" /></div></div>
    <h2>스마트스토어 인증 정보</h2>
    <label>연동용 판매자 ID</label><input placeholder="스마트스토어 연동용 판매자 ID" />
    <div class="row"><div><label>클라이언트 아이디</label><input placeholder="Client ID" /></div><div><label>클라이언트 시크릿</label><input placeholder="Client Secret" /></div></div>
    <div class="actions"><button>테스트</button><div><button>취소</button> <button class="primary">추가</button></div></div>
  </div>
</body>
</html>

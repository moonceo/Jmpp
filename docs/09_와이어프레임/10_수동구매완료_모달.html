<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>외부구매 배송처리 모달</title>
  <style>
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; background:#475569; color:#0f172a; }
    .modal { width:430px; margin:10vh auto; background:white; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.3); padding:22px; }
    h1 { margin:0 0 16px; font-size:20px; } label { display:block; margin:14px 0 6px; font-size:13px; color:#475569; }
    input, select { width:100%; height:38px; border:1px solid #cbd5e1; border-radius:8px; padding:0 10px; box-sizing:border-box; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .summary { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; font-size:13px; }
    .actions { margin-top:18px; }
    button { height:40px; border-radius:8px; border:1px solid #cbd5e1; background:white; font-weight:700; }
    .primary { background:#0284c7; color:white; border-color:#0284c7; }
  </style>
</head>
<body>
  <div class="modal">
    <h1>외부구매 배송처리</h1>
    <p>소싱라이프를 사용하지 않고 직접 구매한 주문의 배송대행지 출고정보를 등록합니다.</p>
    <div class="summary">로봇청소기 X10 Plus 물걸레 겸용<br/>화이트 / 기본형 · 수량 1개 · COUPANG-892123</div>
    <div class="row">
      <div><label>택배사</label><select><option>CJ대한통운</option><option>롯데택배</option><option>한진택배</option></select></div>
      <div><label>국내송장번호</label><input placeholder="송장번호" /></div>
    </div>
    <div class="actions">
      <button class="primary" style="width:100%">외부구매 배송처리</button>
    </div>
  </div>
</body>
</html>

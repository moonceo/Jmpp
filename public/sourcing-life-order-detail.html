<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>소싱라이프 주문상세내역</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    section {
      width: min(520px, 100%);
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      padding: 36px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    p {
      margin: 18px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .order-id {
      margin-top: 24px;
      border-radius: 10px;
      background: #f1f5f9;
      padding: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 800;
      color: #0369a1;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>소싱라이프 주문상세내역</h1>
      <p>임시 주문상세내역 페이지입니다.</p>
      <div id="orderId" class="order-id">-</div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("orderId").textContent = params.get("orderId") || "-";
  </script>
</body>
</html>
